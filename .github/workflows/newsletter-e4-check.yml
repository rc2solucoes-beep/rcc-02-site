name: Newsletter E4 checks

on:
  push:
    branches:
      - feat/admin-e4-newsletter-essential
  pull_request:
    branches:
      - feat/admin-e3-newsletter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newsletter-e4:
    name: TypeScript and E4 unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: E4 unit tests
        run: npx vitest run tests/unit/newsletter/e4-admin-actions.test.ts tests/unit/newsletter/e4-admin-contract.test.ts
